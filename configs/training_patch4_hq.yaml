# High-quality ZELDA run: patch_size=4 for 4x finer token resolution,
# latent_dim=6 + num_bins=8 for a 262k-entry codebook vs the previous 256.
use_wandb: true
wandb_project: world_model

dataset: ZELDA
preload_ratio: 1.0

device: CUDA

# key architectural changes vs baseline
# patch2 @ 64x64: 1024 tokens/frame (same dynamics budget as patch4@128) but each
# token covers only a 2x2 pixel block -> sharpest per-token reconstruction, which
# is what the patch-size comparison favored over coarser patches. The 128x128 cache
# is downsampled to 64x64 on load (see VideoHDF5Dataset).
patch_size: 2
context_length: 4
frame_size: 64
# Codebook = num_bins**latent_dim = 8**4 = 4096. 4x the old baseline (1024), and
# critically small enough that the dynamics softmax over the codebook is tractable
# (the 262k codebook from 6x8 OOMs the dynamics stage). The baseline tokenizer only
# used ~259 codes in the diagnostic, so 4096 is ample headroom.
latent_dim: 4
num_bins: 8
n_actions: 4

# Global batch for all three stages, empirically tuned on a 32GB RTX 5090:
#   tokenizer (compiled)  B=16 -> 11.3GB
#   dynamics  (4096 vocab) B=16 -> 16.2GB
# B=24-32 fits the tokenizer but OOMs dynamics, so 16 is the safe shared value.
# Training is step-based (n_updates), so a smaller batch does NOT lengthen the run.
batch_size_per_gpu: 16
gradient_accumulation_steps: 1

amp: true
tf32: true
compile: true

distributed:
  use_ddp: False
  use_fsdp: False
  reshard_after_forward: False
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/video_tokenizer_hq.yaml
latent_actions_config: configs/latent_actions.yaml
dynamics_config: configs/dynamics_30k.yaml

run_video_tokenizer: true
run_latent_actions: true
run_dynamics: true

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5

use_windowed_attention: false
use_rope: false
use_adaln_zero: false
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
maskgit_schedule: "exp"
