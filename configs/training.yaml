# wandb
use_wandb: true
wandb_project: world_model

# dataset
dataset: ZELDA
preload_ratio: 1.0

# device
device: CUDA

# shared model params
patch_size: 8
context_length: 4
frame_size: 128
latent_dim: 5 # for video tokenizer
num_bins: 4 # for video tokenizer
n_actions: 4

# training
batch_size_per_gpu: 350
gradient_accumulation_steps: 1

# performance
amp: true
tf32: true
compile: true

# distributed launch (torchrun)
distributed: 
  use_ddp: False
  use_fsdp: False
  reshard_after_forward: False
nproc_per_node: 1 # how many GPUs per node
standalone: true # if we're using one node, this eliminates extraneous processes

# stage configs
video_tokenizer_config: configs/video_tokenizer.yaml
latent_actions_config: configs/latent_actions.yaml
dynamics_config: configs/dynamics.yaml

# which stages to run
run_video_tokenizer: false
run_latent_actions: true
run_dynamics: true

# optimizer: "adamw" (default) or "muon" (Newton-Schulz orthogonalized)
optimizer: "adamw"
muon_momentum: 0.95
muon_backend_steps: 5

# Windowed attention in action tokenizer encoder (alternative to mean pool + concat)
use_windowed_attention: false

# RoPE: replace additive sinusoidal PE with rotary position embeddings in all attention layers
use_rope: false

# AdaLN-Zero: pre-norm conditioning with zero-init gate (alternative to FiLM)
use_adaln_zero: false

# MoE (dynamics model only): replaces SwiGLU FFN with top-k routed experts
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01

# MaskGIT unmasking schedule for dynamics inference ("exp" or "halton")
maskgit_schedule: "exp"
