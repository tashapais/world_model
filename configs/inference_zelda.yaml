# Trained ZELDA checkpoints
# Explicit committed checkpoints so `python -m scripts.play` works on a fresh
# clone without relying on find_latest_checkpoint (which sorts by ctime and is
# unreliable when every file shares the git-checkout time).
# Tokenizer reused from the original run; latent-actions + dynamics are the
# action-retrain run (8 codes, target-frame-only masking).
video_tokenizer_path: results/2026_06_05_00_58_45/video_tokenizer/checkpoints/video_tokenizer_step_47500
latent_actions_path: results/2026_06_05_20_01_36_actions/latent_actions/checkpoints/latent_actions_step_14500
dynamics_path: results/2026_06_05_20_01_36_actions/dynamics/checkpoints/dynamics_step_29000
use_latest_checkpoints: false

# dataset
dataset: ZELDA
preload_ratio: 0.1

# device
device: cuda

# inference params
generation_steps: 10
context_window: 4
fps: 2
temperature: 0.5
teacher_forced: false
prediction_horizon: 1

# action selection (overridden per run)
use_actions: false
use_gt_actions: false
use_interactive_mode: false

# output directory (relative to inference_results/)
output_subdir: zelda_trained

# MaskGIT schedule
maskgit_schedule: "exp"

# must match training config
use_adaln_zero: false

# inference acceleration
amp: false
tf32: true
compile: false
