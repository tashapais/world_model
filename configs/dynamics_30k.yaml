# Dynamics model config for patch_size=4 runs.
# n_updates=30000: loss converged ~30k steps in prior ZELDA runs.
# batch_size reduced from 500 to 128: patch_size=4 gives 4x more tokens per
# frame (1024 vs 256), so context sequences are 4x longer and need more memory.
batch_size_per_gpu: 128
gradient_accumulation_steps: 1
n_updates: 30000
learning_rate: 0.01
log_interval: 1000

use_actions: true

embed_dim: 32
num_heads: 8
hidden_dim: 128
num_blocks: 8

video_tokenizer_path:
latent_actions_path:
cached_tokens_path:

checkpoint:
